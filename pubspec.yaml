name: tasktap_mobile
description: "TaskTap mobile app for field technicians — offline-first rapportino creation."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management & DI
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Navigation
  go_router: ^14.8.1

  # Local DB (offline-first)
  drift: ^2.22.1
  sqlite3_flutter_libs: ^0.5.24

  # Auth & backend
  flutter_appauth: ^8.0.3
  dio: ^5.8.0+1

  # Secure storage
  flutter_secure_storage: ^9.2.4

  # Push notifications
  firebase_core: ^3.12.1
  firebase_messaging: ^15.2.1

  # Settings persistence
  shared_preferences: ^2.3.5

  # Connectivity
  connectivity_plus: ^6.1.4

  # Fonts
  google_fonts: ^6.2.1

  # Field capture
  signature: ^5.5.0
  image_picker: ^1.1.2
  geolocator: ^13.0.4

  # Icons
  lucide_icons: ^0.257.0

  # App info
  package_info_plus: ^9.0.1

  # Utilities
  intl: ^0.20.2
  path_provider: ^2.1.5
  path: ^1.9.0
  uuid: ^4.5.1

  # Crash reporting (Sentry)
  # DSN is supplied via --dart-define=SENTRY_DSN=... at build time.
  # When the dart-define is absent (tests, local runs without a DSN) Sentry
  # is NOT initialised and the app still works normally.
  sentry_flutter: ^9.27.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Integration tests (run on device/emulator — not in flutter test)
  integration_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # Code generation
  build_runner: ^2.4.15
  drift_dev: ^2.22.1
  riverpod_generator: ^2.6.3

  # Testing
  mocktail: ^1.0.4

  # App icon + splash generation
  # Run: flutter pub run flutter_launcher_icons
  flutter_launcher_icons: ^0.14.3

  # Run: dart run flutter_native_splash:create
  flutter_native_splash: ^2.4.6

# ── App icon configuration (flutter_launcher_icons) ───────────────────────────
# Source: assets/icons/tasktap_icon.png  (1024×1024 recommended)
# Background: TaskTap brand yellow #FFF10E
# After adding/changing the source PNG, regenerate with:
#   flutter pub run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/tasktap_icon.png"
  # Android adaptive icon
  adaptive_icon_background: "#FFF10E"
  adaptive_icon_foreground: "assets/icons/tasktap_icon.png"
  # iOS background
  background_color_ios: "#FFF10E"
  remove_alpha_ios: true

# ── Splash screen configuration (flutter_native_splash) ───────────────────────
# Regenerate with: dart run flutter_native_splash:create
flutter_native_splash:
  color: "#FFF10E"
  image: "assets/icons/tasktap_icon.png"
  # Scale the logo to 33% of screen width on all densities
  fill: false
  android_12:
    color: "#FFF10E"
    image: "assets/icons/tasktap_icon.png"

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
