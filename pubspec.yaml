name: tasktap_mobile
description: "TaskTap mobile app for field technicians — offline-first rapportino creation."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management & DI
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Navigation
  go_router: ^14.8.1

  # Local DB (offline-first)
  drift: ^2.22.1
  sqlite3_flutter_libs: ^0.5.24

  # Auth & backend
  flutter_appauth: ^8.0.3
  dio: ^5.8.0+1

  # Secure storage
  flutter_secure_storage: ^9.2.4

  # Push notifications
  firebase_core: ^3.12.1
  firebase_messaging: ^15.2.1

  # Settings persistence
  shared_preferences: ^2.3.5

  # Connectivity
  connectivity_plus: ^6.1.4

  # Fonts
  google_fonts: ^6.2.1

  # Field capture
  signature: ^5.5.0
  image_picker: ^1.1.2
  local_auth: ^2.3.0
  geolocator: ^13.0.4

  # Opens the device's own maps app for turn-by-turn directions — no in-app map SDK, no API key.
  url_launcher: ^6.3.1

  # Barcode/QR scanning (materiali lookup) — camera + on-device ML Kit, no cloud call per scan.
  mobile_scanner: ^6.0.2

  # Icons
  lucide_icons: ^0.257.0

  # App info
  package_info_plus: ^9.0.1

  # Utilities
  intl: ^0.20.2
  path_provider: ^2.1.5
  path: ^1.9.0
  uuid: ^4.5.1
  open_filex: ^4.7.0
  share_plus: ^11.0.0

  # Crash reporting (Sentry)
  # DSN is supplied via --dart-define=SENTRY_DSN=... at build time.
  # When the dart-define is absent (tests, local runs without a DSN) Sentry
  # is NOT initialised and the app still works normally.
  sentry_flutter: ^9.27.0
  speech_to_text: ^7.4.0
  crypto: ^3.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Integration tests (run on device/emulator — not in flutter test)
  integration_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # Code generation
  build_runner: ^2.4.15
  drift_dev: ^2.22.1
  riverpod_generator: ^2.6.3

  # Testing
  mocktail: ^1.0.4
  # Fakes ImagePickerPlatform.instance in widget tests (ticket_detail_screen_test.dart) — a
  # transitive dep of image_picker already, declared directly because the test imports it.
  image_picker_platform_interface: ^2.11.1
  # Fakes PathProviderPlatform.instance in widget tests (step_riepilogo_signature_test.dart) —
  # a transitive dep of path_provider already, declared directly for the same reason as above.
  path_provider_platform_interface: ^2.1.3
  plugin_platform_interface: ^2.1.8
  # Golden-image testing (test/golden/) — CI compares against committed goldens, local runs
  # render but don't fail on mismatch (font rendering varies by OS).
  alchemist: ^0.12.1

  # App icon + splash generation
  # Run: flutter pub run flutter_launcher_icons
  flutter_launcher_icons: ^0.14.3

  # Run: dart run flutter_native_splash:create
  flutter_native_splash: ^2.4.6

# ── App icon configuration (flutter_launcher_icons) ───────────────────────────
# Source: assets/icons/tasktap_icon.png  (1024×1024 recommended)
# Background: TaskTap brand yellow #FFF10E
# After adding/changing the source PNG, regenerate with:
#   flutter pub run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/tasktap_icon.png"
  # Android adaptive icon
  adaptive_icon_background: "#FFF10E"
  adaptive_icon_foreground: "assets/icons/tasktap_icon.png"
  # iOS background
  background_color_ios: "#FFF10E"
  remove_alpha_ios: true

# ── Splash screen configuration (flutter_native_splash) ───────────────────────
# Regenerate with: dart run flutter_native_splash:create
flutter_native_splash:
  color: "#FFF10E"
  image: "assets/icons/tasktap_icon.png"
  # Scale the logo to 33% of screen width on all densities
  fill: false
  android_12:
    color: "#FFF10E"
    image: "assets/icons/tasktap_icon.png"

flutter:
  uses-material-design: true

  assets:
    - assets/icons/

  # Sora and Manrope, bundled rather than fetched.
  #
  # They were reaching the app only through the `google_fonts` runtime package, which downloads a
  # family on first use and falls back to the platform font until it lands. In an app whose stated
  # design center is offline that is the wrong default: a technician's first run in a plant room
  # got the system sans, and the two pinned typefaces are a brand commitment.
  #
  # Eighteen call sites were worse off still — they wrote `fontFamily: 'Sora'` / `'Manrope'`
  # directly, naming families that were never declared here, so they had been rendering as the
  # platform font on every device since the day they were written. Declaring the families is what
  # makes those work at all.
  #
  # Only the weights the app actually uses are shipped: Sora 400/600/700, Manrope 400/500/600/700.
  fonts:
    - family: Sora
      fonts:
        - asset: assets/fonts/Sora-400.ttf
          weight: 400
        - asset: assets/fonts/Sora-600.ttf
          weight: 600
        - asset: assets/fonts/Sora-700.ttf
          weight: 700
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-400.ttf
          weight: 400
        - asset: assets/fonts/Manrope-500.ttf
          weight: 500
        - asset: assets/fonts/Manrope-600.ttf
          weight: 600
        - asset: assets/fonts/Manrope-700.ttf
          weight: 700
    # Inter, for the Vetro redesign (2026-08-26). One variable-font file, not per-weight statics
    # like Sora/Manrope above — upstream (rsms/inter v4.1) stopped shipping static TTFs; only a
    # variable font and woff2 remain, and woff2 isn't a format `flutter:` fonts can declare at all.
    # Flutter/Skia resolve `FontWeight` against the file's own `wght` axis, so every weight Vetro
    # uses (400/500/600/700/800) comes from this single 860KB file — smaller than shipping five
    # separate static files would have been anyway.
    - family: Inter
      fonts:
        - asset: assets/fonts/InterVariable.ttf
    # Archivo, Archivo Narrow and IBM Plex Mono, for the Il Documento restyle (2026-09-03). Same
    # bundled-asset approach as Sora/Manrope/Inter above, for the same reason: `google_fonts` sits
    # in `dependencies` unused (nothing in lib/ imports it) precisely because its runtime-download
    # default is wrong for this offline-first app. Archivo and Archivo Narrow ship upstream only as
    # variable fonts (like Inter above) — one file each, weight resolved against the file's own
    # `wght` axis. IBM Plex Mono ships static per-weight files (like Sora/Manrope); only the
    # weights DESIGN.md calls for (400/500) are shipped.
    - family: Archivo
      fonts:
        - asset: assets/fonts/ArchivoVariable.ttf
    - family: Archivo Narrow
      fonts:
        - asset: assets/fonts/ArchivoNarrowVariable.ttf
    - family: IBM Plex Mono
      fonts:
        - asset: assets/fonts/IBMPlexMono-400.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexMono-500.ttf
          weight: 500
