name: Android Release

# Replaces Codemagic's `android_release` workflow. iOS still builds on Codemagic.
#
# This repository is PUBLIC, so the trigger is deliberately narrow: manual dispatch and version
# tags only — never pull_request, which would expose the signing secrets to fork code. Every
# third-party action is pinned to a commit SHA for the same reason (a moved tag would otherwise
# run with the keystore and the Play credentials in scope).
#
# Secrets (repository secrets; set with `gh secret set NAME -R dshala-aea/tasktap-mobile`):
#   KEYSTORE_BASE64            the upload keystore, base64-encoded (`base64 -w0 upload.jks`)
#   KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD
#   PLAY_SERVICE_ACCOUNT_JSON  the Google Play API service account JSON (raw)
#   SENTRY_DSN                 optional

on:
  workflow_dispatch:
    inputs:
      upload_to_play:
        description: 'Publish to the Play internal testing track'
        type: boolean
        default: true
      keep_artifact:
        description: 'Also keep the .aab as a build artifact (PUBLIC repo: downloadable by any GitHub user)'
        type: boolean
        default: false
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish signed AAB
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # Secrets must never reach a build of arbitrary code: only the default branch or a tag.
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')

    env:
      OIDC_ISSUER: https://auth.tasktap.it
      # Quoted deliberately: unquoted, this 18-digit literal exceeds 2^53 and the Actions engine
      # resolves unquoted numeric YAML scalars through doubles, silently corrupting the last two
      # digits and baking a wrong OIDC client id into the build.
      OIDC_CLIENT_ID: "383100431603138562"
      # scheme://path, lowercase RFC 3986 scheme. NOT the application id (underscore is illegal in
      # a scheme). Must equal the Android appAuthRedirectScheme, the iOS CFBundleURLSchemes entry
      # and the redirect URI registered on the Zitadel Native application.
      OIDC_REDIRECT_URI: com.advantedge.tasktap.tasktapmobile://callback
      API_BASE_URL: https://api.tasktap.it
      SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
      PACKAGE_NAME: com.advantedge.tasktap.tasktap_mobile

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          # Keep in lockstep with ci.yml and debug-apk.yml: a floating version previously hit an
          # analyzer/Dart-SDK skew crash inside build_runner.
          flutter-version: '3.44.4'
          channel: stable
          cache: true

      - name: Decode the upload keystore
        # Secrets go through `env:`, never interpolated into the script text: a password with a
        # `$`, a quote or a backtick would otherwise be executed as shell.
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.KEY_ALIAS }}
          KS_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64" || { echo "::error::KEYSTORE_BASE64 secret is not set"; exit 1; }
          test -n "$KS_PASSWORD" && test -n "$KS_ALIAS" && test -n "$KS_KEY_PASSWORD" \
            || { echo "::error::KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD secrets must all be set"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          # android/app/build.gradle.kts reads these plain names.
          {
            printf 'KEYSTORE_PATH=%s\n' "$RUNNER_TEMP/upload.jks"
            printf 'KEYSTORE_PASSWORD=%s\n' "$KS_PASSWORD"
            printf 'KEY_ALIAS=%s\n' "$KS_ALIAS"
            printf 'KEY_PASSWORD=%s\n' "$KS_KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Compute build number
        # Epoch seconds, exactly as Codemagic did: monotonic, and above every versionCode this
        # project has ever uploaded (git counts and Play queries were both unreliable floors).
        run: echo "BUILD_NUMBER=$(date +%s)" >> "$GITHUB_ENV"

      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs

      - name: Work around AGP's android-37 / android-37.0 SDK platform naming mismatch
        # Same known upstream bug the Codemagic workflow worked around (flutter/flutter#192478):
        # AGP caches the installed-SDK set once per Gradle invocation, so a platform it installs
        # on demand mid-build is still "missing" for later tasks in that invocation. Prime it in
        # a throwaway build whose failure is ignored; the real build below then starts a fresh
        # invocation with the platform already on disk.
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          mkdir -p "$SDK_ROOT/platforms"
          ln -sfn "$SDK_ROOT/platforms/android-37.0" "$SDK_ROOT/platforms/android-37" || true
          flutter build appbundle --release --build-number="$BUILD_NUMBER" \
            --dart-define=OIDC_ISSUER="$OIDC_ISSUER" \
            --dart-define=OIDC_CLIENT_ID="$OIDC_CLIENT_ID" \
            --dart-define=OIDC_REDIRECT_URI="$OIDC_REDIRECT_URI" \
            --dart-define=API_BASE_URL="$API_BASE_URL" \
            --dart-define=SENTRY_DSN="$SENTRY_DSN" || true

      - name: Build signed App Bundle (release)
        run: |
          flutter build appbundle --release --build-number="$BUILD_NUMBER" \
            --dart-define=OIDC_ISSUER="$OIDC_ISSUER" \
            --dart-define=OIDC_CLIENT_ID="$OIDC_CLIENT_ID" \
            --dart-define=OIDC_REDIRECT_URI="$OIDC_REDIRECT_URI" \
            --dart-define=API_BASE_URL="$API_BASE_URL" \
            --dart-define=SENTRY_DSN="$SENTRY_DSN"

      - name: Verify the bundle is signed with the upload key (not the debug key)
        run: |
          set -euo pipefail
          AAB=build/app/outputs/bundle/release/app-release.aab
          test -f "$AAB"
          OUT=$(keytool -printcert -jarfile "$AAB")
          echo "$OUT" | grep -E "Owner:|SHA256:" | head -3
          if echo "$OUT" | grep -q "Android Debug"; then
            echo "::error::The bundle is signed with the DEBUG key: the release signing config was not picked up"
            exit 1
          fi

      - name: Publish to Play (internal testing track)
        if: github.event_name == 'push' || inputs.upload_to_play
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ env.PACKAGE_NAME }}
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          track: internal
          status: completed

      - name: Keep the bundle as an artifact
        if: inputs.keep_artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tasktap-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 7

      - name: Remove the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"
