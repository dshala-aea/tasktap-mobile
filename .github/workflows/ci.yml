name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
    # Path filters are ignored by GitHub for tag pushes, so tagged commits are always
    # re-verified (free on a public repo) regardless of paths-ignore.
    tags: ['v*']
    paths-ignore:
      - 'README.md'
      - 'docs/**'
      - '**/*.md'
  pull_request:
    branches: [main, develop]
    paths-ignore:
      - 'README.md'
      - 'docs/**'
      - '**/*.md'

permissions:
  contents: read

# One run per ref. Superseded branch/PR runs are cancelled; tag runs never are.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  # Pinned to the exact version developers build against locally — a floating
  # '3.x' range let CI silently pick up a Flutter/Dart patch release with an
  # analyzer/language-feature version skew (a "Missing implementation of
  # visitDotShorthandPropertyAccess" crash in analyzer's internal linker,
  # not reproducible locally on 3.44.4). Bump deliberately, not implicitly.
  # MUST match `flutter:` in codemagic.yaml and the pin in android-release.yml / debug-apk.yml.
  FLUTTER_VERSION: '3.44.4'

jobs:
  analyze:
    name: Analyze & Test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter analyze
      - run: flutter test

  # Business dates are Europe/Rome days regardless of the phone's zone. The default job runs in
  # UTC; this one re-runs the time-sensitive subset under non-UTC device zones.
  tz-matrix:
    name: Device zone (${{ matrix.tz }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        tz: [Europe/Rome, America/Los_Angeles, Pacific/Auckland]
    env:
      TZ: ${{ matrix.tz }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: >-
          flutter test --no-pub
          test/core/time
          test/data/timbratura
          test/data/worklog_date_parsing_test.dart
          test/data/worklog_wire_shape_test.dart
          test/features/timbra
          test/features/rapportino/steps
          test/features/ticket/worklog_row_date_test.dart
          test/features/ticket/ticket_timer_elapsed_test.dart
          test/features/ticket/ticket_detail_screen_test.dart
          test/features/altro/notifiche_screen_test.dart

  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    needs: analyze
    # Branch pushes only: tags are built/published by android-release.yml and Codemagic.
    if: github.event_name == 'push' && github.ref_type == 'branch'
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter build apk --release

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-release
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7

  build-ios:
    name: Build iOS
    runs-on: macos-latest
    needs: analyze
    # Branch pushes only: tags are built/published by android-release.yml and Codemagic.
    if: github.event_name == 'push' && github.ref_type == 'branch'
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter build ios --release --no-codesign

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ios-release
          path: build/ios/iphoneos/Runner.app
          retention-days: 7
